name: Developer surface bug
description: Report an SDK, MCP, API contract, or example defect
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [TypeScript SDK, Python SDK, MCP server, API contract, Example, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: Package version or MANIFEST source commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove API keys, customer data, and other secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
